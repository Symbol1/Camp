<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">射影平面中點與直線的三維向量示意圖</title>
  <desc id="desc">向量 p 的倍數形成穿過原點的一維子空間，代表射影點；法向量 n 所定義、穿過原點的平面 n dot v equals zero 代表射影直線。</desc>
  <defs>
    <linearGradient id="planeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ecae6" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#219ebc" stop-opacity="0.28"/>
    </linearGradient>
    <marker id="axisArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="normalArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e76f51"/>
    </marker>
    <marker id="pointArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6d28d9"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="648" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>

  <g font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <text x="44" y="48" font-size="25" font-weight="700" fill="#0f172a">Projective point–line duality 的 R³ 直觀圖</text>
    <text x="44" y="76" font-size="16" fill="#475569">用實數三維空間幫助想像；有限體上的內容是同一個 bilinear pairing。</text>

    <!-- Coordinate axes -->
    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#axisArrow)">
      <path d="M460 350 L870 500"/>
      <path d="M460 350 L105 510"/>
      <path d="M460 350 L365 72"/>
    </g>
    <g font-size="18" font-style="italic" fill="#475569">
      <text x="880" y="510">x</text>
      <text x="84" y="527">y</text>
      <text x="349" y="58">z</text>
    </g>

    <!-- Plane through the origin -->
    <polygon points="370,165 870,305 550,535 50,395"
             fill="#d7f1f7" fill-opacity="0.72" stroke="#167f9a" stroke-width="3"/>
    <g stroke="#167f9a" stroke-width="1.2" opacity="0.45">
      <path d="M290 222.5 L790 362.5"/>
      <path d="M210 280 L710 420"/>
      <path d="M130 337.5 L630 477.5"/>
      <path d="M495 200 L175 430"/>
      <path d="M620 235 L300 465"/>
      <path d="M745 270 L425 500"/>
    </g>

    <!-- One-dimensional subspace representing a projective point -->
    <path d="M210 280 L805 447" fill="none" stroke="#6d28d9" stroke-width="4"
          stroke-linecap="round" marker-end="url(#pointArrow)"/>
    <circle cx="610" cy="392" r="7" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
    <circle cx="760" cy="434" r="7" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
    <text x="585" y="378" font-size="18" font-style="italic" fill="#4c1d95">p = (x,y,z)</text>
    <text x="748" y="420" font-size="18" font-style="italic" fill="#4c1d95">λp</text>
    <text x="168" y="259" font-size="16" fill="#4c1d95">span(p)</text>

    <!-- Normal/covector -->
    <path d="M460 350 L523 105" fill="none" stroke="#e76f51" stroke-width="5"
          stroke-linecap="round" marker-end="url(#normalArrow)"/>
    <text x="534" y="112" font-size="19" font-style="italic" font-weight="600" fill="#b43f29">n = (a,b,c)</text>
    <text x="500" y="140" font-size="15" fill="#b43f29">projective line [a,b,c]</text>

    <!-- Origin and right-angle cue -->
    <circle cx="460" cy="350" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="438" y="376" font-size="17" font-style="italic" fill="#0f172a">O</text>
    <path d="M467 323 L493 330 L486 357" fill="none" stroke="#e76f51" stroke-width="2.5"/>

    <!-- Plane label -->
    <g transform="translate(570 490)">
      <rect x="-12" y="-28" width="282" height="66" rx="10" fill="#ffffff" fill-opacity="0.9" stroke="#8ecae6"/>
      <text x="2" y="-2" font-size="19" font-weight="650" fill="#075985">ker(nᵀ) = {v : nᵀv = 0}</text>
      <text x="2" y="24" font-size="16" fill="#0e7490">這個 2D plane 代表 projective line</text>
    </g>

    <!-- Summary card -->
    <g transform="translate(675 70)">
      <rect width="282" height="142" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="18" y="31" font-size="17" font-weight="700" fill="#0f172a">Incidence = pairing 為零</text>
      <text x="18" y="62" font-size="16" fill="#334155">projective point：span(p)</text>
      <text x="18" y="88" font-size="16" fill="#334155">projective line：ker(nᵀ)</text>
      <text x="18" y="118" font-size="18" font-weight="650" fill="#b43f29">nᵀp = ax + by + cz = 0</text>
    </g>
  </g>
</svg>
